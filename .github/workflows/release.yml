# 推送 v* 标签（比如 v1.8.0）时：在 Windows 上编译、跑测试，生成安装包并发布到 GitHub Releases。
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check tag matches application version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/SharedQuickSearch/SharedQuickSearch.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version do not match' }
      - name: Build, test and package Windows application
        shell: pwsh
        run: ./build.ps1
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME installer/SharedQuickSearch-Setup.exe installer/SharedQuickSearch-Portable.exe installer/SHA256SUMS.txt --verify-tag --title "共享速搜 $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
