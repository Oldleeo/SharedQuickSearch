name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          [xml]$proj = Get-Content src/SharedQuickSearch/SharedQuickSearch.csproj
          $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($tag -ne $version) { throw "Tag $tag does not match app $version" }
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1
      - name: Generate and verify signed manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) { throw 'UPDATE_SIGNING_KEY is not configured' }
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $repo = '${{ github.repository }}'
          dotnet run --project tools/UpdateSigner -c Release --no-restore -- manifest --exe installer/SharedQuickSearch-Setup.exe --version $version --url "https://github.com/$repo/releases/download/$tag/SharedQuickSearch-Setup.exe" --notes "https://github.com/$repo/releases/tag/$tag" --out installer/update.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tools/UpdateSigner -c Release --no-restore -- sign installer/update.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tools/UpdateSigner -c Release --no-restore -- verify --manifest installer/update.json --exe installer/SharedQuickSearch-Setup.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            installer/SharedQuickSearch-Setup.exe
            installer/SharedQuickSearch-Portable.exe
            installer/SHA256SUMS.txt
            installer/update.json
            installer/update.json.sig
          fail_on_unmatched_files: true
          generate_release_notes: true
